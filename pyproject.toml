[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "tmailor"
dynamic = ["version"]
description = "Python SDK for the Tmailor Open API: create temporary email addresses and read incoming messages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Tmailor" }]
keywords = ["tmailor", "temp mail", "temporary email", "disposable email", "otp", "email testing", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.scripts]
tmailor = "tmailor.cli:run"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "pytest-cov", "mypy>=1.5", "ruff>=0.5", "build", "pyyaml>=6"]

[project.urls]
Homepage = "https://tmailor.com"
Platform = "https://platform.tmailor.com"
Documentation = "https://platform.tmailor.com/docs"
Support = "https://tmailor.com/contact-us"
Repository = "https://github.com/tmailor-com/tmailor-python"
Issues = "https://github.com/tmailor-com/tmailor-python/issues"
Changelog = "https://github.com/tmailor-com/tmailor-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/tmailor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tmailor"]

[tool.hatch.build.targets.sdist]
# The shared conformance scenarios ship inside the sdist at <root>/conformance/scenarios
# (tests/conformance_runner.py looks there first), so `pytest` from an unpacked sdist runs every scenario.
include = [
    "src/tmailor", "tests", "examples", "conformance/scenarios", "conformance/README.md",
    "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real API (needs TMAILOR_API_KEY and an allowlisted IP)"]
addopts = "-p no:cacheprovider"

[tool.mypy]
strict = true
python_version = "3.10"  # oldest version mypy 2.x accepts; ruff + vermin-style review keep 3.9 syntax
files = ["src/tmailor"]

[tool.ruff]
line-length = 130
target-version = "py39"
src = ["src", "tests"]
cache-dir = "/tmp/ruff-cache-tmailor-sdk"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"examples/*" = ["S101"]
"src/tmailor/_core.py" = ["S311"]
